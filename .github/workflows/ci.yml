name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Keep CI fast: only install what the unit + integration tests need.
          pip install pytest numpy psutil opencv-python-headless tqdm \
                      "scenedetect[opencv]>=0.6.3" "open-clip-torch>=2.24.0" \
                      torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Interface check
        run: python -m evaluation.evaluate --check-interface --submission ./submission

      - name: Unit + integration tests
        env:
          VS_ENABLE_AUDIO: "0"
          VS_ENABLE_OCR: "0"
        run: pytest submission/tests -q
